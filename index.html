<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICAOdle</title>
<link rel="stylesheet" href="/style.css">
<main>
<h2 class="top">
  <!-- Logo: four split-flap tiles spelling ICAO + "dle". Link to "/" = back to the menu (progress is saved in localStorage). -->
  <a href="/" title="Back to menu" aria-label="ICAOdle, back to menu"><svg width="190" height="48" viewBox="0 0 250 56" role="img">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset=".49" stop-color="#262c38"/><stop offset=".5" stop-color="#0d1014"/><stop offset=".51" stop-color="#1a1f28"/></linearGradient></defs>
    <g font-family="monospace" font-weight="bold" font-size="34" fill="#ffb81c" text-anchor="middle">
      <g class="tile"><rect x="2" y="4" width="40" height="48" rx="5" fill="url(#lg)"/><text x="22" y="39">I</text></g>
      <g class="tile"><rect x="48" y="4" width="40" height="48" rx="5" fill="url(#lg)"/><text x="68" y="39">C</text></g>
      <g class="tile"><rect x="94" y="4" width="40" height="48" rx="5" fill="url(#lg)"/><text x="114" y="39">A</text></g>
      <g class="tile"><rect x="140" y="4" width="40" height="48" rx="5" fill="url(#lg)"/><text x="160" y="39">O</text></g>
    </g>
    <text x="188" y="40" font-family="system-ui,sans-serif" font-weight="bold" font-size="30" fill="#e8eaee">dle</text></svg></a>
  <small id="round"></small></h2>
<div id="menu">
  <div id="rank"><div id="rankTop"><b></b><span></span></div><div id="rankBar"><i></i></div></div>
  <div id="datebar"><button id="dprev" class="ghost" aria-label="Previous day" title="Earlier day">&#9664;</button><span id="dlabel"></span><button id="dnext" class="ghost" aria-label="Next day" title="Later day">&#9654;</button></div>
  <button data-m="easy">Normal<small>Major airports</small></button>
  <button data-m="medium">Hard<small>Regional airline airports</small></button>
  <button data-m="hard">Extra Hard<small>Small local airports</small></button>
  <div id="more"><button id="nearBtn" title="Airports near where you live">Zip Code</button><button id="customBtn" title="Pick a state and format, just for fun">Custom game</button></div>
</div>
<dialog id="near">
  <p><b>Zip Code</b></p>
  <label>ZIP code <input id="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="12345"></label>
  <label>Within <span><select id="miles"><option>25</option><option>50</option><option>100</option><option>250</option><option>500</option></select> miles</span></label>
  <small class="note">Up to 5 airports near that ZIP. Just for fun: no grade, no score, not saved.</small>
  <div id="nearErr" role="alert"></div>
  <div id="nearBtns"><button id="nearGo">Start</button> <button id="nearCancel" class="ghost">Cancel</button></div>
</dialog>
<div id="custom" hidden>
  <p>Set up a custom game.</p>
  <div id="opts">
    <label>Format <select id="fmt"><option value="map">Map</option><option value="city">City &amp; state only</option></select></label>
    <label>State <select id="st"><option value="">All states</option></select></label>
    <label>Difficulty <select id="diff"><option value="easy">Normal</option><option value="medium">Hard</option><option value="hard">Extra Hard</option></select></label>
    <small class="note">Custom games are practice: 5 random airports, <b>not</b> part of the daily set or the global scores.</small>
  </div>
  <button id="customGo">Start</button> <button id="customBack" class="ghost">Back</button>
</div>
<div id="game" hidden>
  <div id="board"><div id="lcol"><button id="menuBack" type="button" title="Back to the main menu">Main Menu</button><div id="flap"></div>
</div><div id="map"></div><div id="col"><div id="guesses"></div><div id="cluebox"></div></div></div>
  <form id="f"><span id="help" tabindex="0" role="note" aria-label="Guess can be with the K (KLAX) prefix or without (LAX)." data-tip="Guess can be with the K prefix or without.">?</span><input id="g" maxlength="4" autocomplete="off" placeholder="ICAO" aria-label="ICAO code"> <div id="acts"><button id="go">Guess</button><button id="skip" type="button" class="ghost" title="Pass this guess (costs a guess). On your last guess it gives up the round.">Skip</button><button id="giveup" type="button" class="ghost" title="Give up this round (counts as a loss)"><span class="lbl">Give up</span><span class="lbl alt">Are you sure?</span></button></div></form>
  <div id="stats" hidden>
    <div id="grade" role="img"><div class="letter"></div><div class="pct"></div></div>
    <div id="result"><div id="statline"></div><div id="quip"></div>
      <div id="xpbar" hidden><div id="xpTop"><b id="xpRank"></b><span id="xpNum"></span></div><div id="xpTrack"><i></i></div></div><div id="xp"></div></div>
    <canvas id="chart" width="600" height="220" hidden></canvas>
    <div id="endbtns"><button id="replay" hidden>Play again</button><button id="again" hidden onclick="location.href=menuUrl()">Main Menu</button></div>
  </div>
  <div id="choices" hidden></div>
  <div id="msg"></div>
</div>
<details id="dev" hidden><summary>Dev</summary><button id="reset">Dev: reset all stats</button><small id="devAnswers"></small></details>
</main>
<footer><div id="soundctl"><button id="mute" class="ghost" title="Turn sounds on or off"></button><input id="vol" type="range" min="0" max="1" step="0.05" value="0.2" aria-label="Volume"></div><div id="timer"></div></footer>
<script>
if(location.hostname=="localhost"){$reset=document.getElementById("reset");document.getElementById("dev").hidden=false;
  $reset.onclick=async()=>{if(!confirm("Wipe all stats and local progress?"))return;
    await fetch("/api/reset",{method:"POST"});try{localStorage.clear()}catch{}location.reload()}
  // dev only: today's answers, on the menu for all three difficulties (and, once a game starts, for that game)
  Promise.all(["easy","medium","hard"].map(m=>fetch(`/api/today?mode=${m}`).then(r=>r.json()))).then(ds=>{
    document.getElementById("devAnswers").textContent=ds.map((d,i)=>["Normal","Hard","Extra Hard"][i]+": "+d.airports.map(a=>a[0]).join(" ")).join("\n")}).catch(()=>{})}
let PER=5; const TRIES=4; // 3 hint stages => 4th guess is the last. PER is the rounds in this game: 5, or fewer in an "Airports near me" game
const NAME={easy:"Normal",medium:"Hard",hard:"Extra Hard"}; // what players see; the keys stay easy/medium/hard in saves, scores and the server
let DAY,MODE,today,SAVE,S,map,$=id=>document.getElementById(id);
// New sets generate at UTC midnight (matches server.js).
function tick(){const m=Math.floor(((Math.floor(Date.now()/864e5)+1)*864e5-Date.now())/6e4);$("timer").textContent=`New set in ${Math.floor(m/60)}h ${m%60}m`}
tick();setInterval(tick,3e4);
// Menu date picker: the daily sets can be opened for any earlier day back to FIRST, the day the server's database was started. Games played on an
// earlier day count in that day's stats too. A difficulty already finished on the chosen day shows a green check + score; click it to see the results.
const TODAY=Math.floor(Date.now()/864e5);
let PICK=TODAY,FIRST=TODAY; // FIRST is replaced by the server's answer just below (until then there is nothing earlier to open)
const dayText=(n,short)=>new Date(n*864e5).toLocaleDateString(undefined,short?{month:"short",day:"numeric",timeZone:"UTC"}:{weekday:"short",month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}); // days are UTC, like the server
function paintMenu(){
  $("dlabel").innerHTML=dayText(PICK)+(PICK==TODAY?"":"<small>Past day</small>");
  $("dprev").disabled=PICK<=FIRST;$("dnext").disabled=PICK>=TODAY;
  document.querySelectorAll("#menu button[data-m]").forEach(b=>{b.classList.remove("done");b.title="";const old=b.querySelector(".check");if(old)old.remove();try{
    const s=JSON.parse(localStorage[`icaodle${PICK}${b.dataset.m}`]); // the same key the game saves under
    if(s.scores.length>=PER){b.classList.add("done");b.title="View results";
      b.firstChild.after(Object.assign(document.createElement("span"),{className:"check",textContent:`✓ ${s.scores.reduce((a,c)=>a+c,0)}/${PER*TRIES}`}))}}catch{}})} // the check and score sit inside the button, after its name
$("dprev").onclick=()=>{PICK--;snd("back");paintMenu()};
$("dnext").onclick=()=>{PICK++;snd("forward");paintMenu()};
paintMenu();
fetch("/api/archive").then(r=>r.json()).then(d=>{FIRST=Math.min(d.first,TODAY);const p=+new URLSearchParams(location.search).get("day");if(p>=FIRST&&p<=TODAY)PICK=p;paintMenu()}).catch(()=>{}); // ?day=N comes back here from a finished earlier-day game
// XP and rank (per device, in localStorage): earned by finishing today's daily sets, shown here and on the results panel. Logic is in xp.js.
let XPM=null;const xpState=()=>{try{return JSON.parse(localStorage.icaoXp)}catch{return XPM.fresh()}};
function paintRank(){
  const s=xpState(),i=XPM.rankIndex(s.xp),[min,name]=XPM.RANKS[i],nxt=XPM.RANKS[i+1],streak=XPM.liveStreak(s,TODAY);
  $("rank").querySelector("b").textContent=name;
  $("rank").querySelector("span").textContent=(nxt?`${s.xp} / ${nxt[0]} XP`:`${s.xp} XP`)+(streak>1?` · ${streak}-day streak`:""); // the streak only shows once there is one
  $("rankBar").firstChild.style.width=(nxt?100*(s.xp-min)/(nxt[0]-min):100)+"%";
  $("rank").hidden=false}
import("/xp.js").then(m=>{XPM=m;paintRank()}).catch(()=>{});
// Sound: sfx.js = uisfx "mechanical" pack + your /sounds files. The code loads with the page but stays silent until the first
// pointerdown / keydown unlocks audio, and nothing plays while muted. snd("event") is a no-op until then.
let SND=null;
// On a phone, focusing the text box pops the keyboard over the board, so only desktops get the automatic focus.
const focusInput=()=>{if(!matchMedia("(pointer:coarse)").matches)$("g").focus()};
const snd=e=>SND&&SND.play(e);
const paintSound=()=>{const on=!SND||SND.enabled;$("mute").textContent=on?"🔊 Sound on":"🔇 Sound off";$("mute").setAttribute("aria-pressed",String(!on));if(SND)$("vol").value=SND.volume};
(async()=>{try{
  const [{createSound},{createUISFX}]=await Promise.all([import("/sfx.js"),import("/vendor/uisfx.js")]);
  SND=createSound({createUISFX,storage:localStorage,AudioContextCtor:window.AudioContext||window.webkitAudioContext});
  for(const ev of ["pointerdown","keydown"])addEventListener(ev,()=>SND.unlock(),{capture:true}); // genuine gestures only
  addEventListener("pagehide",()=>SND.destroy()); // final teardown: player first, then its AudioContext
  paintSound();
}catch{}})();
// Back-arrow button (left edge of the answer panel): leave to the main menu. Daily progress is saved; a practice game isn't, so that one asks first.
let LOCAL=null; // {zip,miles} for an "Airports near me" game
const tag=()=>LOCAL?`Near ${LOCAL.zip}`:NAME[MODE]+dateTag();
const dateTag=()=>!PRACTICE&&DAY&&DAY!==TODAY?" · "+dayText(DAY,true):""; // e.g. "Normal · Nov 20 1/5" on an earlier day
const menuUrl=()=>DAY&&!PRACTICE&&DAY!==TODAY?"/?day="+DAY:"/"; // finishing or leaving an earlier-day game returns to that day on the menu
$("menuBack").onclick=()=>{if(PRACTICE&&S&&S.i<PER&&!confirm("Leave this practice game? Practice games aren't saved."))return;location.href=menuUrl()};
$("mute").onclick=()=>{if(!SND)return;SND.unlock();SND.setEnabled(!SND.enabled);paintSound()};
$("vol").oninput=()=>SND&&SND.setVolume($("vol").value);
paintSound();
// The menu planes are drawn as a shape, not a font symbol: the symbol points a different way (and can turn into a color emoji) on different phones
// and computers, so it could never be made to face the way it flies everywhere. This one always has its nose along +x, length 2, centered on 0.
const PLANE=(()=>{const top=[[1,0],[.6,.08],[.2,.1],[-.15,.95],[-.35,.95],[-.25,.12],[-.75,.1],[-.95,.38],[-1.05,.38],[-1,0]],p=new Path2D();
  p.moveTo(...top[0]);top.slice(1).forEach(([x,y])=>p.lineTo(x,y)); // down the upper side to the tail...
  for(let i=top.length-2;i>=1;i--)p.lineTo(top[i][0],-top[i][1]);p.closePath();return p})(); // ...and back up the mirrored lower side

// Correct answer: confetti falls behind the containers (canvas z-index 0, the page content sits above it).
function confetti(speed=5,secs=0){ // speed in m/s, where 1 m = 100 px, so 5 m/s = 500 px per second; secs > 0 keeps it raining for that long
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return; // a visual effect, so respect the motion preference
  const c=document.createElement("canvas"),x=c.getContext("2d"),H=innerHeight,W=innerWidth;c.width=W;c.height=H;c.className="fx"+(secs||matchMedia("(max-width:820px)").matches?" front":""); // on a phone the panels cover almost the whole screen, so it falls in front there
  document.body.append(c);
  const cols=["--accent","--text","--ok","--muted"].map(css),rnd=Math.random;
  const P=Array.from({length:secs?170:110},()=>({x:rnd()*W,y:-30-rnd()*H*.35,vy:speed*100*(.8+rnd()*.4),vx:(rnd()-.5)*70,w:6+rnd()*6,h:10+rnd()*8,r:rnd()*6.3,vr:(rnd()-.5)*8,f:rnd()*6.3,vf:3+rnd()*5,c:cols[Math.floor(rnd()*cols.length)]}));
  const dur=secs?secs*1000:(H*1.35+40)/(speed*100*.8)*1000+300; // long enough for the slowest piece (and the spawn offset) to clear the screen
  setTimeout(()=>c.remove(),dur+600); // safety net: if animation frames are paused (background tab) the canvas still goes away
  let last=performance.now();const t0=last;
  (function f(n){const dt=Math.min(.05,(n-last)/1e3);last=n;x.clearRect(0,0,W,H);
    x.globalAlpha=Math.max(0,Math.min(1,(dur-(n-t0))/300)); // fade out over the last 0.3 s
    for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.f+=p.vf*dt;if(secs&&p.y>H+30&&n-t0<dur-2500){p.y=-30;p.x=rnd()*W} // celebration: pieces re-enter at the top until the last few seconds
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.f));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()} // the cosine flips each piece like paper tumbling
    dur-(n-t0)>0?requestAnimationFrame(f):c.remove()})(last)}
// Title-screen intro: all four logo tiles start flipping at once, then settle on I, C, A, O one after another, left to right.
// Each tile counts forward through the alphabet at its own steady pace for exactly as long as it needs to land on its letter at its settle time.
(function logoFlip(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const today=Math.floor(Date.now()/864e5); // once a day: after the first play, the logo just sits on ICAO until tomorrow
  try{if(localStorage["icaodle:intro"]==today)return;localStorage["icaodle:intro"]=today}catch{}
  const ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  document.querySelectorAll("h2.top .tile").forEach((g,i)=>{
    const text=g.querySelector("text"),t=ABC.indexOf(text.textContent),
      gap=75+Math.random()*20,                      // ms per flap
      settle=1000+i*450+Math.random()*120;          // when this tile lands: I first, O last
    let k=Math.round(settle/gap);                   // flaps still to go
    const show=()=>text.textContent=ABC[(((t-k)%26)+26)%26];
    show();
    setTimeout(function step(){k--;show();g.classList.remove("f");void g.getBoundingClientRect();g.classList.add("f");if(k>0)setTimeout(step,gap)},gap)});
})();
// Split-flap display: each cell steps through the ring one flap at a time until it lands on the target letter.
const RING="-ABCDEFGHIJKLMNOPQRSTUVWXYZ";
// One flap word per round (PER of them), each starting as K---; a solved/lost round keeps its answer.
const buildFlap=()=>$("flap").innerHTML=Array.from({length:PER},()=>`<div class="w">${[..."K---"].map(c=>`<span>${c}</span>`).join("")}<div class="nm"></div></div>`).join("");
function flap(word,r,i=0){ // left to right: each letter lands before the next one starts
  if(i>=word.length)return;const el=$("flap").children[r].children[i];
  const n=(RING.indexOf(word[i])-RING.indexOf(el.textContent)+RING.length)%RING.length,gap=500/(n||1); // each letter takes ~0.5s however far it has to flip
  (function step(){if(el.textContent==word[i])return flap(word,r,i+1);el.textContent=RING[(RING.indexOf(el.textContent)+1)%RING.length];snd("flap");
    el.classList.remove("f");void el.offsetWidth;el.classList.add("f");setTimeout(step,gap)})()}
// Round over: flap to the answer, then wait for Next (which flaps back to K--- and loads the next round).
// rounds solved on the first guess in a row, counting back from round r (a wrong guess, skip or loss in a round breaks the run)
const runAt=r=>{let n=0;while(r-n>=0&&S.scores[r-n]==TRIES)n++;return n};
const xpGame=()=>!PRACTICE&&DAY===TODAY; // only today's daily games earn XP
const ALT=t=>FMT=="city"?t[8]||[]:[]; // other airports in the same city count as right answers only in the City and state format
let SHOWN=[]; // the code the player typed for each solved round (another airport in the same city counts)
const nameOf=r=>{const n=$("flap").children[r].querySelector(".nm"),al=ALT(today[r]),shown=al.find(x=>x[0]==SHOWN[r]);n.textContent=shown?shown[3]:today[r][6];
  const others=[today[r][0],...al.map(x=>x[0])].filter(x=>x!=(shown?shown[0]:today[r][0]));if(others.length)n.insertAdjacentHTML("beforeend",`<i>also ${others.join(" ")}</i>`);
  if(S.scores[r]==1)n.insertAdjacentHTML("beforeend","<b>Final guess</b>"); // solved with the last guess (score 1 of 4)
  const run=runAt(r);
  if(run>=2)n.insertAdjacentHTML("beforeend",`<b class="st${Math.min(run,4)}">${xpGame()&&XPM?`+${XPM.streakXp(run)} XP &middot; `:""}${run}x streak</b>`)};
const paint=r=>$("flap").children[r].classList.add(S.scores[r]>0?"ok":"no");
// V = round being viewed. Rounds before S.i are finished and can be reviewed with Back/Next.
let V=0;
const navs=()=>[...$("flap").children].forEach((g,i)=>{g.classList.toggle("cur",i==V);g.classList.toggle("go",i<=Math.min(S.i,PER-1))}); // "go" = a round you can click: finished ones and the current one
// Round over (solved, lost or skipped): flip the answer in, then move straight on after a beat.
let LIVE=false; // true once a round has just been played in this page, so the results animate; reopening a finished game just shows them
function reveal(c){LIVE=true;nameOf(S.i-1);flap(c,S.i-1);paint(S.i-1);
  $("g").disabled=$("go").disabled=$("skip").disabled=$("giveup").disabled=true;
  setTimeout(()=>{$("msg").textContent="";if(S.i>=PER){const top=LOCAL?S.scores.every(v=>v>0):S.scores.reduce((a,b)=>a+b,0)==PER*TRIES;
      if(runAt(PER-1)<PER)snd("endGame"); // a 5-in-a-row already played streak5 as its end-of-game sound
      if(top)confetti(4,10)} // 100%: ten seconds of confetti
    show();focusInput()},1500)}
// Each airport row on the left is a button: click a finished round to review it, or the current round to get back to guessing.
$("flap").onclick=e=>{const i=[...$("flap").children].indexOf(e.target.closest(".w"));if(i<0||i==V||i>Math.min(S.i,PER-1)||busy)return;snd("forward");$("msg").textContent="";i<S.i?view(i):(show(),focusInput())};
function save(){if(!SAVE)return;try{localStorage[SAVE]=JSON.stringify(S)}catch{}}
// The key lives in .env on the server (never in this file or git); the browser still has to receive it, so restrict it by referrer in Google Cloud.
function loadMaps(){return fetch("/api/config").then(r=>r.json()).then(({key})=>new Promise((ok,bad)=>{
  window.gm_authFailure=()=>{$("map").textContent="Google Maps rejected the API key (check key, enabled APIs, billing, referrer)."};
  const s=document.createElement("script");s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;s.onload=ok;s.onerror=bad;document.head.append(s)}))}
let FMT="map",ST="",PRACTICE=false;
// Menu options persist (localStorage) so "Change state" returns to the same selection; ?go=&fmt=&st= auto-starts (used by Play again).
fetch("/api/states").then(r=>r.json()).then(list=>{
  $("st").innerHTML+=list.map(x=>`<option>${x}</option>`).join("");
  const p=new URLSearchParams(location.search);let o={};try{o=JSON.parse(localStorage.icaoOpts)}catch{}
  $("fmt").value=p.get("fmt")||o.fmt||"map";$("st").value=p.get("st")??o.st??"";
  $("diff").value=o.diff||"easy";
  if(p.get("go"))start(p.get("go"),p.get("fmt")||"map",p.get("st")||"")});
document.querySelectorAll("#menu button[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m,"map","")); // daily: map, all states
$("customBtn").onclick=()=>{snd("open");$("menu").hidden=true;$("custom").hidden=false};
$("customBack").onclick=()=>{snd("back");$("custom").hidden=true;$("menu").hidden=false};
$("customGo").onclick=()=>{try{localStorage.icaoOpts=JSON.stringify({fmt:$("fmt").value,st:$("st").value,diff:$("diff").value})}catch{}start($("diff").value,$("fmt").value,$("st").value||"ALL")}; // a custom game is never the daily set: no state = random airports from any state
// Airports near me: a popup asks for a ZIP and a radius, the server finds the airports (up to 5) and the game starts like a practice game.
const NEAR=$("near");
try{const o=JSON.parse(localStorage.icaoNear);$("zip").value=o.zip||"";$("miles").value=o.miles||"50"}catch{$("miles").value="50"}
$("nearBtn").onclick=()=>{snd("open");$("nearErr").textContent="";NEAR.showModal();$("zip").focus()};
$("nearCancel").onclick=()=>{snd("back");NEAR.close()};
$("nearGo").onclick=async()=>{const zip=$("zip").value.trim(),miles=$("miles").value,err=m=>$("nearErr").textContent=m;
  if(!/^\d{5}$/.test(zip))return err("Enter a 5-digit ZIP code.");
  err("Looking…");const d=await fetch(`/api/near?zip=${zip}&miles=${miles}`).then(r=>r.json()).catch(()=>({error:"Couldn't look that up. Try again."}));
  if(d.error)return err(d.error);
  try{localStorage.icaoNear=JSON.stringify({zip,miles})}catch{}
  LOCAL={zip,miles};NEAR.close();start("easy","map","NEAR",d)};
$("zip").onkeydown=e=>{if(e.key=="Enter")$("nearGo").click()};
async function start(m,fmt,st,data){
  MODE=m;FMT=fmt;ST=st;PRACTICE=!!ST;
  const d=data||await fetch(PRACTICE?`/api/state?mode=${m}&state=${ST}`:`/api/today?mode=${m}&day=${PICK}`).then(r=>r.json());
  DAY=d.day;today=d.airports;PER=today.length;buildFlap();
  if(location.hostname=="localhost")$("devAnswers").textContent=tag()+": "+today.map(a=>a[0]).join(" "); // dev only: this game's answersdocument.querySelector("h2.top a").href=menuUrl(); // the logo returns to the menu on the same day
SAVE=PRACTICE?null:`icaodle${DAY}${MODE}${FMT=="city"?"-city":""}`; // practice games aren't saved
  S=null;if(SAVE)try{S=JSON.parse(localStorage[SAVE])}catch{} S=S||{i:0,fails:0,scores:[]};
  snd(S.i>=PER?"open":"start"); // reopening a finished game just opens its results
  $("menu").hidden=$("custom").hidden=true;$("game").hidden=false;
  sky.stop(); // the menu background only runs on the menu
  today.slice(0,S.i).forEach((a,r)=>[...a[0]].forEach((ch,i)=>$("flap").children[r].children[i].textContent=ch));S.scores.forEach((_,r)=>{paint(r);nameOf(r)}); // restore finished rounds after a refresh
  if(FMT=="city")$("map").classList.add("txt"); // no map in this format: the city and state are the whole prompt
  else{await loadMaps();map=new google.maps.Map($("map"),{mapTypeId:"satellite",disableDefaultUI:true,zoomControl:true,styles:[{elementType:"labels",stylers:[{visibility:"off"}]},{featureType:"road",elementType:"labels",stylers:[{visibility:"on"}]}],gestureHandling:matchMedia("(pointer:coarse)").matches?"cooperative":"greedy",center:{lat:39,lng:-98},zoom:4})}
  show();focusInput()}
// Right column: Guesses (used/4), and under it Clues. Each miss unlocks the next clue and it pops in: region, then city/state, then the first letter.
const REGION={};
for(const [r,list] of Object.entries({"Pacific Northwest":"WA OR","West Coast":"CA","Mountain West":"ID MT WY CO UT NV","Southwest":"AZ NM TX OK","Great Plains":"ND SD NE KS","Midwest":"MN IA MO WI IL IN MI OH","South":"AR LA MS AL TN KY","Southeast":"FL GA SC NC VA WV","Mid-Atlantic":"NY NJ PA DE MD DC","New England":"ME NH VT MA RI CT",Alaska:"AK",Hawaii:"HI"}))for(const st of list.split(" "))REGION[st]=r;
const CLUE_KEYS=[["region"],["loc"],["name","first"]]; // 1st miss: region (and the map gains place names); 2nd: city/state; 3rd: the airport name with its city blanked out, plus the first letter
let seenClues={i:-1,n:0}; // how many clues of this round were already showing, so only a newly unlocked one pops up
function side(){
  const t=today[S.i],f=S.fails,n=Math.min(f,CLUE_KEYS.length), // every miss (or skip) unlocks the next clue; the last guess has all three
  val={region:REGION[t[2]]||t[2],
    loc:FMT=="city"?`Elevation: ${t[7].toLocaleString()} ft`:`${t[1]}, ${t[2]}`, // the city format already shows the city, so its 2nd clue is the elevation
    first:`Starts with ${[...new Set([t[0],...ALT(t).map(x=>x[0])].map(x=>x[1]))].join(" or ")}`, // the letter after the K (every right answer's, when a city has several airports)
    name:t[6].replace(new RegExp(t[1].split(/[^A-Za-z]+/).filter(w=>w.length>2).join("|")||"$^","gi"),m=>"_".repeat(m.length))}, // the airport's name with any city word blanked
  known=seenClues.i===S.i?seenClues.n:n; // after a reload, or a new round, nothing counts as new
  seenClues={i:S.i,n};
  $("guesses").innerHTML=`<b>Guesses ${f}/${TRIES}</b>`+Array.from({length:TRIES},(_,k)=>`<div>${((S.guesses||[])[k]||"&mdash;").replace(/↑(\d+)/,'<span class="dir" style="transform:rotate($1deg)">↑</span>')}</div>`).join("");
  $("cluebox").innerHTML="<b>Clues</b>"+CLUE_KEYS.slice(0,n).map((ks,j)=>`<div${j>=known?' class="pop"':""}>${ks.map(k=>val[k]).join("<br>")}</div>`).join("")}
function forfeit(text){hideCH();const c=today[S.i][0];S.scores.push(0);S.i++;S.fails=0;S.guesses=[];
  $("msg").textContent=`${text}: ${c}`;snd("lost");save();reveal(c)}
$("skip").onclick=()=>{if(S.i>=PER||busy)return;
  if(S.fails>=TRIES-1)return forfeit("Skipped");
  S.fails++;(S.guesses||=[]).push("skip");snd("skip");save();show()};
// Give up (next to Skip): ends this round now as a loss, whatever guesses are left.
// First press arms it (the label fades to "Are you sure?"); a second press gives up. It disarms after 4 s, on blur, and whenever the round changes.
let armTimer;const gu=$("giveup");
// The two labels sit on top of each other; CSS cross-fades them when the button gets the "armed" class.
function setArmed(on){gu.classList.toggle("armed",on);gu.setAttribute("aria-label",on?"Are you sure? Press again to give up this round":"Give up this round")}
function disarm(){clearTimeout(armTimer);if(gu.classList.contains("armed"))setArmed(false)}
setArmed(false); // sets the accessible name (otherwise it would read both labels)
gu.onclick=()=>{if(S.i>=PER||busy)return;
  if(!gu.classList.contains("armed")){setArmed(true);armTimer=setTimeout(disarm,4000);return}
  disarm();forfeit("Gave up")};
gu.onblur=()=>disarm();
function setMap(t,zoom,minZ){
  if(FMT=="city"){$("map").innerHTML=`<span>${t[1]}<br>${t[2]}</span>`;return}const lat=t[3],lon=t[4],B=.03;
  // Free pan/zoom, but limited: can't pan far from the airport, can't zoom out past the starting view until the zoom-out hint (1st miss) unlocks it.
  map.setOptions({minZoom:minZ,maxZoom:Math.min(20,t[5]+3),restriction:{latLngBounds:{north:lat+B,south:lat-B,east:lon+B,west:lon-B}}});
  map.setCenter({lat,lng:lon});map.setZoom(zoom)}
function show(){
  V=S.i;navs();disarm();$("cluebox").hidden=false;
  if(S.i>=PER){view(PER-1);return end()} // game over: stay on the board (Back/Next review the rounds); the results take the answer panel's place
  $("g").disabled=$("go").disabled=false;$("skip").disabled=$("giveup").disabled=false;
  const t=today[S.i],[c,city,st,,,z]=t,f=S.fails;
  $("round").textContent=`${tag()} ${S.i+1}/${PER}`;
  side();setMap(t,f>=1?10:z,f>=1?10:z-1);
  if(FMT!="city")map.setMapTypeId(f>=1?"hybrid":"satellite"); // after a miss the map gains road and place names
  choose(c,f)}
// Last guess: four buttons (the answer and three decoys from its tier) instead of typing from scratch. The box still works.
const CH=$("choices");
const hideCH=()=>{CH.hidden=true;$("f").hidden=false}; // the answer panel and the Final guess panel take turns in the same spot
async function choose(c,f){hideCH();CH.innerHTML="";if(f<TRIES-1||S.i>=PER)return;
  const d=await fetch("/api/decoys?code="+c+"&skip="+ALT(today[S.i]).map(x=>x[0])).then(r=>r.json()).catch(()=>null);if(!d)return; // couldn't load the choices: the answer panel stays
  if(S.fails<TRIES-1||today[S.i][0]!=c)return; // the round moved on while loading
  CH.innerHTML="<b>Final guess</b>"+[c,...d].sort(()=>Math.random()-.5).map(x=>`<button type="button" class="ghost">${x}</button>`).join("");CH.hidden=false;$("f").hidden=true}
CH.onclick=e=>{if(e.target.matches("button")){$("g").value=e.target.textContent;$("f").requestSubmit()}};
function view(v){ // review a finished round: its airport, answer and result; no guessing
  V=v;navs();$("cluebox").hidden=CH.hidden=true;const t=today[v];$("g").disabled=$("go").disabled=$("skip").disabled=$("giveup").disabled=true;
  $("round").textContent=`${tag()} ${v+1}/${PER}`;
  $("guesses").innerHTML=`<b>Round ${v+1}</b><div>${S.scores[v]>0?"Solved":"Missed"}</div><div>${t[0]}</div><div>${t[1]}, ${t[2]}</div><div>Score ${S.scores[v]}/${TRIES}</div>`;
  setMap(t,t[5],t[5]-1)}
const HOT=500; // miles: within this = hot, otherwise cold
const bearing=(a,b,c,d)=>{const r=Math.PI/180;return Math.round((Math.atan2(Math.sin((d-b)*r)*Math.cos(c*r),Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r))/r+360)%360)}; // compass degrees from the guess to the answer
const miles=(a,b,c,d)=>{const r=Math.PI/180,h=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 3959*2*Math.asin(Math.sqrt(h))};
let busy;
$("f").onsubmit=async e=>{e.preventDefault();
  if(S.i>=PER||busy)return;
  let g=$("g").value.trim().toUpperCase(); $("g").value="";
  if(g.length==3)g="K"+g; if(!/^K[A-Z]{3}$/.test(g))return;
  busy=1;const i0=S.i,t=today[S.i],c=t[0],alts=ALT(t),ok=g==c||alts.some(x=>x[0]==g);let lbl=g; // City and state game: another airport in the same city is also right
  if(!ok){const a=await fetch("/api/lookup?code="+g).then(r=>r.json()).catch(()=>({}));
    if(a.lat!=null){const [d,p]=[[t[3],t[4]],...alts.map(x=>[x[1],x[2]])].map(p=>[miles(a.lat,a.lon,p[0],p[1]),p]).sort((x,y)=>x[0]-y[0])[0]; // hot/cold and the arrow point at the nearest right answer
      lbl+=(d<=HOT?" hot":" cold")+"↑"+bearing(a.lat,a.lon,p[0],p[1])+((S.guesses||[]).length>=2?` ${Math.round(d)} mi`:"")}} // distance shown from the 3rd guess on
  if(ok){SHOWN[S.i]=g;S.scores.push(TRIES-S.fails);S.i++;S.fails=0;S.guesses=[];$("msg").textContent="";snd("streak"+Math.max(1,Math.min(runAt(S.i-1),5)));confetti()} // the solve sound climbs with the first-guess run: streak1 ... streak5 (streak1 also for a solve after a miss)
  else if((S.guesses||=[]).push(lbl),++S.fails>=TRIES){S.scores.push(0);S.i++;S.fails=0;S.guesses=[];$("msg").textContent=`Out of guesses: ${[c,...alts.map(x=>x[0])].join(" or ")} (last guess ${lbl.replace(/↑\d+/,"")})`;snd("lost")}
  else snd("wrong")
  busy=0;hideCH();save();S.i>i0?reveal(ok?g:c):show()};
// Results screen -> "Review rounds": back to the board in read-only mode (Back/Next through the 5 rounds; Next from the last returns here).
// Letter grade for the results screen: points out of the maximum, as a percentage. The color slides red -> orange -> green as the score
// approaches the A line (so an A is fully green).
const GRADES=[[70,"A"],[55,"B"],[40,"C"],[25,"D"],[0,"F"]]; // with only 20 points to earn, 14 of them (70%) is an A
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>`rgb(${hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t)).join(",")})`;
const gradeColor=p=>{const [r,o,g]=["--bad","--orange","--ok"].map(css);return p<50?mix(r,o,p/50):mix(o,g,(p-50)/50)};
function showGrade(points){
  const pct=Math.round(100*points/(PER*TRIES)),letter=GRADES.find(([min])=>pct>=min)[1];
  $("grade").style.color=gradeColor(Math.min(100,pct/.7));$("grade").setAttribute("aria-label",`Grade ${letter}, ${pct} percent`);
  $("grade").children[0].textContent=letter;$("grade").children[1].textContent=pct+"%"}
// A roast to match the grade (A first, F last): the better you did, the less impressed we are.
const QUIPS=[["Meh. I've seen better.","An A? Cute. The airports were practically waving at you.","Congrats, you can read a map. Try not to let it go to your head."],
  ["A B. Aggressively fine.","Solid B. Did your co-pilot do most of it?","Almost impressive, which is the most dangerous kind of mediocre."],
  ["Dead average. The airports didn't even notice you landed.","A C: you showed up, you landed, nobody's talking about it.","Half right, like a departure board in a thunderstorm."],
  ["A D. Did you navigate by vibes?","Impressive, if the goal was to find every wrong airport.","The map was right there. It's a big map."],
  ["An F. The airports are filing a complaint.","That wasn't flying. That was falling with extra steps.","Even the autopilot took you off the crew list."]];
function end(){
  const t=S.scores.reduce((a,b)=>a+b,0),right=S.scores.filter(v=>v>0).length,pct=LOCAL?100*right/PER:100*t/(PER*TRIES);
  $("xp").textContent="";$("xpbar").hidden=true;
  $("f").hidden=true;$("stats").hidden=$("again").hidden=false; // the results replace the answer panel; the board stays above
  $("board").classList.add("over"); // the guesses/clues column goes and the map takes its width
  if(FMT!="city"&&map)setTimeout(()=>{google.maps.event.trigger(map,"resize");map.setCenter({lat:today[V][3],lng:today[V][4]})})
  const q=QUIPS[GRADES.findIndex(([m])=>Math.round(pct)>=m)]; // same tiers as the letter grade
  $("quip").textContent=q[Math.floor(Math.random()*q.length)];
  $("stats").classList.toggle("nochart",LOCAL||PRACTICE); // no global stats for these
  if(LOCAL){$("grade").hidden=true;$("statline").innerHTML=`<b>${right}/${PER}</b>`;$("again").textContent="Main Menu";return} // near-me games: no grade, no score, nothing sent
  showGrade(t);
  if(!PRACTICE&&DAY===TODAY&&XPM){const r=XPM.award(xpState(),DAY,MODE,t,right,PER,S.scores);try{localStorage.icaoXp=JSON.stringify(r.state)}catch{}
    $("xp").innerHTML=`+${r.gain} XP`+(r.rankUp?` &middot; Promoted to <b>${r.rankUp}</b>!`:"");
    xpBar(r.state.xp-r.gain,r.state.xp,r.rankUp,LIVE&&!matchMedia("(prefers-reduced-motion: reduce)").matches)}
  else if(!PRACTICE&&DAY!==TODAY)$("xp").textContent="Past days don't earn XP.";
  $("statline").innerHTML=`<b>${t}/${PER*TRIES}</b> points`;
  if(PRACTICE){$("replay").hidden=false;$("replay").onclick=()=>location.href=`/?go=${MODE}&fmt=${FMT}&st=${ST}`;return} // practice: replay or change state, no global score
  (SUB||=postScore()).then(d=>chart(d,t)).catch(()=>{$("stats").classList.add("nochart")})}
// The XP bar under the quip: starts where you were, then SNAPS forward (the easing overshoots the mark and settles) with a sound. If the gain fills a
// rank it snaps to full, rolls over into the next rank and plays the rank-up sound. Not live (a reopened game): it just shows where you are now.
function xpBar(from,to,up,live){
  const R=XPM.RANKS,bar=$("xpbar"),fill=bar.querySelector("i");
  const pct=xp=>{const k=XPM.rankIndex(xp),n=R[k+1];return n?100*(xp-R[k][0])/(n[0]-R[k][0]):100};
  const label=xp=>{const k=XPM.rankIndex(xp),n=R[k+1];$("xpRank").textContent=R[k][1];$("xpNum").textContent=n?`${xp} / ${n[0]} XP`:`${xp} XP`};
  const snap=w=>{fill.style.transition="width .32s cubic-bezier(.2,1.6,.4,1)";fill.style.width=w+"%"};
  const set=(xp)=>{fill.style.transition="none";fill.style.width=pct(xp)+"%";label(xp)};
  bar.hidden=false;bar.classList.remove("pop");set(live?from:to);
  if(!live)return;
  setTimeout(()=>{bar.classList.add("pop");
    if(!up){snd("xpSnap");label(to);snap(pct(to));return}
    snd("xpSnap");snap(100); // fills the old rank...
    setTimeout(()=>{snd("rankUp");label(to);fill.style.transition="none";fill.style.width="0%";void fill.offsetWidth;snap(pct(to))},420)}, // ...then rolls into the new one
  600)}
// The score goes to the global stats once, when the game is over; the reply feeds the distribution chart.
let SUB;
function postScore(){
  const score=S.scores.reduce((a,b)=>a+b,0),right=S.scores.filter(v=>v>0).length;let id;try{id=localStorage.pid=localStorage.pid||crypto.randomUUID()}catch{id=crypto.randomUUID()}
  return fetch("/api/score",{method:"POST",body:JSON.stringify({id,day:DAY,mode:MODE+(FMT=="city"?"-city":""),score,right})}).then(r=>r.json())}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function chart(d,me){
  const dist=d.dist,c=$("chart"),x=c.getContext("2d"),n=PER*TRIES+1,m=Math.max(...Object.values(dist),1);
  c.hidden=false;
  // draw at the size it's shown (times the screen's pixel density) so the text stays sharp, instead of stretching a fixed 600px bitmap
  const W=Math.max(300,c.clientWidth),H=220,dpr=devicePixelRatio||1,w=W/n,base=190;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+"px";x.scale(dpr,dpr);
  for(let k=0;k<n;k++){const h=(dist[k]||0)/m*150;x.globalAlpha=k==me?1:.35;x.fillStyle=k==me?css("--brand"):css("--text");x.fillRect(k*w+2,base-h,w-4,h);x.globalAlpha=1}
  x.fillStyle=css("--muted");x.font="11px system-ui";x.textAlign="center";for(let k=0;k<n;k+=5)x.fillText(k,k*w+w/2,base+14);
  // dotted vertical lines: the average player's score and yours; labels sit on opposite sides (and different heights) so they don't collide, and flip so they never run off the edge
  const mark=(v,col,label,y,align)=>{const px=(v+.5)*w;x.strokeStyle=x.fillStyle=col;x.lineWidth=2;x.setLineDash([4,4]);
    x.beginPath();x.moveTo(px,34);x.lineTo(px,base);x.stroke();x.setLineDash([]);x.font="bold 12px system-ui";
    const tw=x.measureText(label).width;if(align=="right"&&px-5-tw<0)align="left";else if(align=="left"&&px+5+tw>W)align="right";
    x.textAlign=align;x.fillText(label,px+(align=="left"?5:-5),y)};
  const lowAvg=d.avg<=me;
  mark(d.avg,css("--text"),`Average ${d.avg.toFixed(1)}`,12,lowAvg?"right":"left");
  mark(me,css("--brand"),`You ${me}`,26,lowAvg?"left":"right")}
// Menu background: a few muted planes fly straight across the screen. Most are small and slow, behind the containers; a few are larger,
// faster and fainter, passing in front of them for depth. Two colors only (amber and grey). Runs only while the menu / custom screen is
// showing (start() stops it).
const sky=(()=>{
  const BACK=3,FRONT=2,MAX=20,M=90; // 5 planes to start; clicking the background adds more, up to MAX; off-screen margin (px)
  let cb,cf,xb,xf,raf,W,H,running=false,last,cols,planes=[];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function spawn(front,anywhere,at){ // a straight line across, left to right or right to left; `at` = start at a clicked point
    const ltr=Math.random()<.5,h=(ltr?0:Math.PI)+rnd(-.5,.5);
    return{front,user:!!at,h,rot:h,col:Math.random()<.5?0:1,
      x:at?at.x:anywhere?rnd(0,W):(ltr?-M:W+M),y:at?at.y:rnd(0,H),
      speed:front?rnd(55,85):rnd(22,38),s:front?rnd(46,64):rnd(18,30),a:front?.14:.2}}
  function step(dt){
    for(let i=planes.length-1;i>=0;i--){const p=planes[i];
      p.x+=Math.cos(p.h)*p.speed*dt;p.y+=Math.sin(p.h)*p.speed*dt;
      if(p.x<-M-10||p.x>W+M+10||p.y<-M-10||p.y>H+M+10)p.user?planes.splice(i,1):planes[i]=spawn(p.front,false)} // flown off the screen: a plane you launched is gone for good; the starting ones are replaced by a new plane entering
  }
  function draw(){
    for(const cx of [xb,xf])cx.clearRect(0,0,W,H);
    for(const p of planes){const cx=p.front?xf:xb;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      cx.globalAlpha=p.a;cx.fillStyle=cols[p.col];cx.scale(p.s/2,p.s/2);cx.fill(PLANE);cx.restore()}
  }
  // a click on empty menu background (not a button, link, field, footer or the logo) launches another plane, up to MAX
  function onClick(e){if(planes.length>=MAX||e.target.closest("button,a,select,input,label,#opts,footer,h2,dialog"))return;planes.push(spawn(Math.random()<.3,false,{x:e.clientX,y:e.clientY}))}
  function tick(n){if(!running)return;const dt=Math.min(.05,(n-last)/1e3);last=n;step(dt);draw();raf=requestAnimationFrame(tick)}
  function size(){W=cb.width=cf.width=innerWidth;H=cb.height=cf.height=innerHeight}
  return{
    start(){
      if(running||matchMedia("(prefers-reduced-motion: reduce)").matches)return; // decorative motion, so respect the preference
      running=true;
      cb=document.createElement("canvas");cb.className="fx";cf=document.createElement("canvas");cf.className="fx front";document.body.append(cb,cf);
      xb=cb.getContext("2d");xf=cf.getContext("2d");size();addEventListener("resize",size);document.addEventListener("click",onClick);
      cols=[css("--accent"),css("--muted")]; // two muted colors: amber and grey
      planes=[...Array.from({length:BACK},()=>spawn(false,true)),...Array.from({length:FRONT},()=>spawn(true,true))];
      last=performance.now();raf=requestAnimationFrame(tick);
    },
    count:()=>planes.length,sim(seconds,dt=.05){for(let t=0;t<seconds;t+=dt)step(dt)}, // for testing
    stop(){running=false;cancelAnimationFrame(raf);removeEventListener("resize",size);document.removeEventListener("click",onClick);cb&&cb.remove();cf&&cf.remove()},
  };
})();
sky.start();
</script>
