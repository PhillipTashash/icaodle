<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICAOdle</title>
<link rel="stylesheet" href="/style.css">
<main>
<h2 class="top">
  <!-- Logo: four split-flap tiles spelling ICAO + "dle". Link to "/" = back to the menu (progress is saved in localStorage). -->
  <a href="/" title="Back to menu" aria-label="ICAOdle, back to menu"><svg width="190" height="48" viewBox="0 0 250 56" role="img">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset=".49" stop-color="#262c38"/><stop offset=".5" stop-color="#0d1014"/><stop offset=".51" stop-color="#1a1f28"/></linearGradient></defs>
    <g font-family="monospace" font-weight="bold" font-size="34" fill="#ffb81c" text-anchor="middle">
      <g class="tile"><rect x="2" y="4" width="40" height="48" rx="5" fill="url(#lg)"/><text x="22" y="39">I</text></g>
      <g class="tile"><rect x="48" y="4" width="40" height="48" rx="5" fill="url(#lg)"/><text x="68" y="39">C</text></g>
      <g class="tile"><rect x="94" y="4" width="40" height="48" rx="5" fill="url(#lg)"/><text x="114" y="39">A</text></g>
      <g class="tile"><rect x="140" y="4" width="40" height="48" rx="5" fill="url(#lg)"/><text x="160" y="39">O</text></g>
    </g>
    <text x="188" y="40" font-family="system-ui,sans-serif" font-weight="bold" font-size="30" fill="#e8eaee">dle</text></svg></a>
  <small id="round"></small></h2>
<div id="menu">
  <p>Guess the airport's ICAO code.</p>
  <button data-m="easy">Easy<small>Major international airports</small></button>
  <button data-m="medium">Medium<small>International &amp; private-jet airports</small></button>
  <button data-m="hard">Hard<small>Local, small airports</small></button>
  <button id="customBtn">Custom game&hellip;</button>
</div>
<div id="custom" hidden>
  <p>Set up a custom game.</p>
  <div id="opts">
    <label>Format <select id="fmt"><option value="map">Map</option><option value="city">City &amp; state only</option></select></label>
    <label>State <select id="st"><option value="">All states</option></select></label>
    <label>Difficulty <select id="diff"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
    <small class="note">Custom games are practice: 5 random airports, <b>not</b> part of the daily set or the global scores.</small>
  </div>
  <button id="customGo">Start</button> <button id="customBack" class="ghost">Back</button>
</div>
<div id="game" hidden>
  <div id="board"><div id="lcol"><div id="flap"></div>
    <div id="nav"><button id="back">&#9664; Back</button><button id="next">Next &#9654;</button></div></div><div id="map"></div><div id="col"><div id="guesses"></div><div id="cluebox"></div></div></div>
  <form id="f"><button id="menuBack" type="button" title="Back to the main menu" aria-label="Back to the main menu"><svg viewBox="0 0 24 32" width="24" height="32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 30V17C17 11 14 9 6 9"/><path d="M11 3 4.5 9 11 15"/></svg></button><span id="help" tabindex="0" role="note" aria-label="Guess can be with the K (KLAX) prefix or without (LAX)." data-tip="Guess can be with the K prefix or without.">?</span><input id="g" maxlength="4" autocomplete="off" placeholder="ICAO" aria-label="ICAO code"> <div id="acts"><button id="go">Guess</button><button id="skip" type="button" class="ghost" title="Pass this guess (costs a guess). On your last guess it gives up the round.">Skip</button><button id="giveup" type="button" class="ghost" title="Give up this round (counts as a loss)"><span class="lbl">Give up</span><span class="lbl alt">Are you sure?</span></button></div></form>
  <div id="msg"></div>
  <div id="stats" hidden>
    <div id="grade" role="img"><div class="letter"></div><div class="pct"></div></div>
    <div id="statline"></div>
    <canvas id="chart" width="600" height="220" hidden></canvas>
    <div id="endbtns"><button id="review" class="ghost">Review rounds</button><button id="replay" hidden>Play again</button><button id="again" hidden onclick="location.href='/'">Play another difficulty</button></div>
  </div>
</div>
<p><button id="reset" hidden>Dev: reset all stats</button></p>
</main>
<footer><div id="soundctl"><button id="mute" class="ghost" title="Turn sounds on or off"></button><input id="vol" type="range" min="0" max="1" step="0.05" value="0.2" aria-label="Volume"></div><div id="timer"></div></footer>
<script>
if(location.hostname=="localhost"){$reset=document.getElementById("reset");$reset.hidden=false;
  $reset.onclick=async()=>{if(!confirm("Wipe all stats and local progress?"))return;
    await fetch("/api/reset",{method:"POST"});try{localStorage.clear()}catch{}location.reload()}}
const PER=5, TRIES=4; // 3 hint stages => 4th guess is the last
let DAY,MODE,today,SAVE,S,map,$=id=>document.getElementById(id);
// New sets generate at UTC midnight (matches server.js).
function tick(){const m=Math.floor(((Math.floor(Date.now()/864e5)+1)*864e5-Date.now())/6e4);$("timer").textContent=`New set in ${Math.floor(m/60)}h ${m%60}m`}
tick();setInterval(tick,3e4);
// Menu: a difficulty already finished today (this browser) shows a green check + your score; click it to see the results and review the rounds.
document.querySelectorAll("#menu button[data-m]").forEach(b=>{try{
  const s=JSON.parse(localStorage[`icaodle${Math.floor(Date.now()/864e5)}${b.dataset.m}`]); // same UTC day key the game saves under
  if(s.scores.length>=PER){b.classList.add("done");b.title="View today's results";
    b.insertAdjacentHTML("beforeend",`<span class="check">✓ ${s.scores.reduce((a,c)=>a+c,0)}/${PER*TRIES}</span>`)}}catch{}});
// Sound: sfx.js = uisfx "mechanical" pack + your /sounds files. The code loads with the page but stays silent until the first
// pointerdown / keydown unlocks audio, and nothing plays while muted. snd("event") is a no-op until then.
let SND=null;
const snd=e=>SND&&SND.play(e);
const paintSound=()=>{const on=!SND||SND.enabled;$("mute").textContent=on?"🔊 Sound on":"🔇 Sound off";$("mute").setAttribute("aria-pressed",String(!on));if(SND)$("vol").value=SND.volume};
(async()=>{try{
  const [{createSound},{createUISFX}]=await Promise.all([import("/sfx.js"),import("/vendor/uisfx.js")]);
  SND=createSound({createUISFX,storage:localStorage,AudioContextCtor:window.AudioContext||window.webkitAudioContext});
  for(const ev of ["pointerdown","keydown"])addEventListener(ev,()=>SND.unlock(),{capture:true}); // genuine gestures only
  addEventListener("pagehide",()=>SND.destroy()); // final teardown: player first, then its AudioContext
  paintSound();
}catch{}})();
// Back-arrow button (left edge of the answer panel): leave to the main menu. Daily progress is saved; a practice game isn't, so that one asks first.
$("menuBack").onclick=()=>{if(PRACTICE&&S&&S.i<PER&&!confirm("Leave this practice game? Practice games aren't saved."))return;location.href="/"};
$("mute").onclick=()=>{if(!SND)return;SND.unlock();SND.setEnabled(!SND.enabled);paintSound()};
$("vol").oninput=()=>SND&&SND.setVolume($("vol").value);
paintSound();
// Which way does the plane glyph's nose point? It depends on the font (right in Windows' Segoe UI Symbol, up-right in some others), so measure it once:
// draw it off-screen, take its long axis, and call the narrower end (the nose; the tail has the wide stabilizers) the front. NOSE is an angle (0 = right).
const PLANE_FONT="'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',sans-serif";
const NOSE=(()=>{try{
  const n=120,c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");
  x.font="90px "+PLANE_FONT;x.textAlign="center";x.textBaseline="middle";x.fillText("\u2708\uFE0E",n/2,n/2);
  const d=x.getImageData(0,0,n,n).data,pts=[];let sx=0,sy=0;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(d[(i*n+j)*4+3]>128){pts.push([j,i]);sx+=j;sy+=i}
  if(pts.length<50)return -Math.PI/4; // no glyph rendered: assume the common up-right plane
  const mx=sx/pts.length,my=sy/pts.length;let sxx=0,syy=0,sxy=0;for(const [px,py] of pts){sxx+=(px-mx)**2;syy+=(py-my)**2;sxy+=(px-mx)*(py-my)}
  const a=.5*Math.atan2(2*sxy,sxx-syy),ux=Math.cos(a),uy=Math.sin(a);let lo=1e9,hi=-1e9;
  for(const [px,py] of pts){const t=(px-mx)*ux+(py-my)*uy;lo=Math.min(lo,t);hi=Math.max(hi,t)}
  const span=hi-lo,width=(t0,t1)=>{let u=1e9,v=-1e9;for(const [px,py] of pts){const t=(px-mx)*ux+(py-my)*uy;if(t>=t0&&t<=t1){const s=-(px-mx)*uy+(py-my)*ux;u=Math.min(u,s);v=Math.max(v,s)}}return v-u};
  return width(hi-span*.25,hi)<width(lo,lo+span*.25)?a:a+Math.PI;
}catch{return -Math.PI/4}})();

// Correct answer: confetti falls behind the containers (canvas z-index 0, the page content sits above it).
function confetti(speed=5){ // speed in m/s, where 1 m = 100 px, so 5 m/s = 500 px per second
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return; // a visual effect, so respect the motion preference
  const c=document.createElement("canvas"),x=c.getContext("2d"),H=innerHeight,W=innerWidth;c.width=W;c.height=H;c.className="fx";document.body.append(c);
  const cols=["--accent","--text","--ok","--muted"].map(css),rnd=Math.random;
  const P=Array.from({length:110},()=>({x:rnd()*W,y:-30-rnd()*H*.35,vy:speed*100*(.8+rnd()*.4),vx:(rnd()-.5)*70,w:6+rnd()*6,h:10+rnd()*8,r:rnd()*6.3,vr:(rnd()-.5)*8,f:rnd()*6.3,vf:3+rnd()*5,c:cols[Math.floor(rnd()*cols.length)]}));
  const dur=(H*1.35+40)/(speed*100*.8)*1000+300; // long enough for the slowest piece (and the spawn offset) to clear the screen
  setTimeout(()=>c.remove(),dur+600); // safety net: if animation frames are paused (background tab) the canvas still goes away
  let last=performance.now();const t0=last;
  (function f(n){const dt=Math.min(.05,(n-last)/1e3);last=n;x.clearRect(0,0,W,H);
    x.globalAlpha=Math.max(0,Math.min(1,(dur-(n-t0))/300)); // fade out over the last 0.3 s
    for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.f+=p.vf*dt;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.f));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()} // the cosine flips each piece like paper tumbling
    dur-(n-t0)>0?requestAnimationFrame(f):c.remove()})(last)}
// Title-screen intro: the logo's tiles flip like a split-flap board and land on I, C, A, O. Each tile starts a few letters before its own letter
// (4 to 9 flips, a little random) and counts forward through the alphabet, so it looks random but always resolves; the tiles start one after another.
(function logoFlip(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  document.querySelectorAll("h2.top .tile").forEach((g,i)=>{
    const text=g.querySelector("text"),t=ABC.indexOf(text.textContent);let k=4+Math.floor(Math.random()*6);
    text.textContent=ABC[(t-k+26)%26];
    setTimeout(function step(){k--;text.textContent=ABC[(t-k+26)%26];g.classList.remove("f");void g.getBoundingClientRect();g.classList.add("f");if(k>0)setTimeout(step,70+Math.random()*50)},i*170+Math.random()*80)});
})();
// Split-flap display: each cell steps through the ring one flap at a time until it lands on the target letter.
const RING="-ABCDEFGHIJKLMNOPQRSTUVWXYZ";
// One flap word per round (PER of them), each starting as K---; a solved/lost round keeps its answer.
$("flap").innerHTML=Array.from({length:PER},()=>`<div class="w">${[..."K---"].map(c=>`<span>${c}</span>`).join("")}<div class="nm"></div></div>`).join("");
function flap(word,r,i=0){ // left to right: each letter lands before the next one starts
  if(i>=word.length)return;const el=$("flap").children[r].children[i];
  const n=(RING.indexOf(word[i])-RING.indexOf(el.textContent)+RING.length)%RING.length,gap=500/(n||1); // each letter takes ~0.5s however far it has to flip
  (function step(){if(el.textContent==word[i])return flap(word,r,i+1);el.textContent=RING[(RING.indexOf(el.textContent)+1)%RING.length];snd("flap");
    el.classList.remove("f");void el.offsetWidth;el.classList.add("f");setTimeout(step,gap)})()}
// Round over: flap to the answer, then wait for Next (which flaps back to K--- and loads the next round).
const nameOf=r=>$("flap").children[r].querySelector(".nm").textContent=today[r][6];
const paint=r=>$("flap").children[r].classList.add(S.scores[r]>0?"ok":"no");
// V = round being viewed. Rounds before S.i are finished and can be reviewed with Back/Next; Next from the last finished round returns to play.
let V=0;
const navs=()=>{$("back").disabled=V<=0;$("next").disabled=V>=S.i;[...$("flap").children].forEach((g,i)=>g.classList.toggle("cur",i==V))};
// Round over (solved, lost or skipped): flip the answer in, then move straight on after a beat.
function reveal(c){nameOf(S.i-1);flap(c,S.i-1);paint(S.i-1);
  $("g").disabled=$("go").disabled=$("skip").disabled=$("giveup").disabled=$("back").disabled=$("next").disabled=true;
  setTimeout(()=>{$("msg").textContent="";if(S.i>=PER)snd(S.scores.every(v=>v>0)?"perfect":"finish");show();$("g").focus()},1500)}
$("next").onclick=()=>{snd("forward");$("msg").textContent="";V+1<S.i?view(V+1):(show(),$("g").focus())};
$("back").onclick=()=>{snd("back");$("msg").textContent="";view(V-1)};
function save(){if(!SAVE)return;try{localStorage[SAVE]=JSON.stringify(S)}catch{}}
// The key lives in .env on the server (never in this file or git); the browser still has to receive it, so restrict it by referrer in Google Cloud.
function loadMaps(){return fetch("/api/config").then(r=>r.json()).then(({key})=>new Promise((ok,bad)=>{
  window.gm_authFailure=()=>{$("map").textContent="Google Maps rejected the API key (check key, enabled APIs, billing, referrer)."};
  const s=document.createElement("script");s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;s.onload=ok;s.onerror=bad;document.head.append(s)}))}
let FMT="map",ST="",PRACTICE=false;
// Menu options persist (localStorage) so "Change state" returns to the same selection; ?go=&fmt=&st= auto-starts (used by Play again).
fetch("/api/states").then(r=>r.json()).then(list=>{
  $("st").innerHTML+=list.map(x=>`<option>${x}</option>`).join("");
  const p=new URLSearchParams(location.search);let o={};try{o=JSON.parse(localStorage.icaoOpts)}catch{}
  $("fmt").value=p.get("fmt")||o.fmt||"map";$("st").value=p.get("st")??o.st??"";
  $("diff").value=o.diff||"easy";
  if(p.get("go"))start(p.get("go"),p.get("fmt")||"map",p.get("st")||"")});
document.querySelectorAll("#menu button[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m,"map","")); // daily: map, all states
$("customBtn").onclick=()=>{snd("open");$("menu").hidden=true;$("custom").hidden=false};
$("customBack").onclick=()=>{snd("back");$("custom").hidden=true;$("menu").hidden=false};
$("customGo").onclick=()=>{try{localStorage.icaoOpts=JSON.stringify({fmt:$("fmt").value,st:$("st").value,diff:$("diff").value})}catch{}start($("diff").value,$("fmt").value,$("st").value||"ALL")}; // a custom game is never the daily set: no state = random airports from any state
async function start(m,fmt,st){
  MODE=m;FMT=fmt;ST=st;PRACTICE=!!ST;
  const d=await fetch(PRACTICE?`/api/state?mode=${m}&state=${ST}`:"/api/today?mode="+m).then(r=>r.json());
  DAY=d.day;today=d.airports;SAVE=PRACTICE?null:`icaodle${DAY}${MODE}${FMT=="city"?"-city":""}`; // practice games aren't saved
  S=null;if(SAVE)try{S=JSON.parse(localStorage[SAVE])}catch{} S=S||{i:0,fails:0,scores:[]};
  snd(S.i>=PER?"open":"start"); // reopening a finished game just opens its results
  $("menu").hidden=$("custom").hidden=true;$("game").hidden=false;
  sky.stop(); // the menu background only runs on the menu
  today.slice(0,S.i).forEach((a,r)=>[...a[0]].forEach((ch,i)=>$("flap").children[r].children[i].textContent=ch));S.scores.forEach((_,r)=>{paint(r);nameOf(r)}); // restore finished rounds after a refresh
  if(FMT=="city")$("map").classList.add("txt"); // no map in this format: the city and state are the whole prompt
  else{await loadMaps();map=new google.maps.Map($("map"),{mapTypeId:"satellite",disableDefaultUI:true,zoomControl:true,gestureHandling:"greedy",center:{lat:39,lng:-98},zoom:4})}
  show();$("g").focus()}
// Right column: Guesses (used/4), and under it Clues. "Show Clue" reveals the next clue and costs one guess: region, then city/state, then the first letter.
const REGION={};
for(const [r,list] of Object.entries({"Pacific Northwest":"WA OR","West Coast":"CA","Mountain West":"ID MT WY CO UT NV","Southwest":"AZ NM TX OK","Great Plains":"ND SD NE KS","Midwest":"MN IA MO WI IL IN MI OH","South":"AR LA MS AL TN KY","Southeast":"FL GA SC NC VA WV","Mid-Atlantic":"NY NJ PA DE MD DC","New England":"ME NH VT MA RI CT",Alaska:"AK",Hawaii:"HI"}))for(const st of list.split(" "))REGION[st]=r;
const CLUE_KEYS=["region","loc","first"];
function side(){
  const t=today[S.i],f=S.fails,got=S.clues||[],
  val={region:REGION[t[2]]||t[2],
    loc:FMT=="city"?`Elevation: ${t[7].toLocaleString()} ft`:`${t[1]}, ${t[2]}`, // the city format already shows the city, so its 2nd clue is the elevation
    first:`Starts with ${t[0][1]}`}; // the letter after the K
  $("guesses").innerHTML=`<b>Guesses ${f}/${TRIES}</b>`+Array.from({length:TRIES},(_,k)=>`<div>${(S.guesses||[])[k]||"&mdash;"}</div>`).join("");
  $("cluebox").innerHTML="<b>Clues</b>"+got.map(k=>`<div>${val[k]}</div>`).join("")
    +`<button id="clue" ${got.length>=CLUE_KEYS.length||f>=TRIES-1?"disabled":""}>Show Clue</button>`} // can't spend your last guess
$("cluebox").onclick=e=>{if(e.target.id!="clue"||busy||S.i>=PER)return;
  const got=S.clues||(S.clues=[]);
  if(got.length>=CLUE_KEYS.length||S.fails>=TRIES-1)return;
  got.push(CLUE_KEYS[got.length]);S.fails++;(S.guesses||=[]).push("clue");snd("clue");save();show()};
// Skip (next to Guess): passes this guess without a clue. On the last guess it forfeits the round (counts as a loss).
function forfeit(text){const c=today[S.i][0];S.scores.push(0);S.i++;S.fails=0;S.guesses=[];S.clues=[];
  $("msg").textContent=`${text}: ${c}`;snd("lost");save();reveal(c)}
$("skip").onclick=()=>{if(S.i>=PER||busy)return;
  if(S.fails>=TRIES-1)return forfeit("Skipped");
  S.fails++;(S.guesses||=[]).push("skip");snd("skip");save();show()};
// Give up (next to Skip): ends this round now as a loss, whatever guesses are left.
// First press arms it (the label fades to "Are you sure?"); a second press gives up. It disarms after 4 s, on blur, and whenever the round changes.
let armTimer;const gu=$("giveup");
// The two labels sit on top of each other; CSS cross-fades them when the button gets the "armed" class.
function setArmed(on){gu.classList.toggle("armed",on);gu.setAttribute("aria-label",on?"Are you sure? Press again to give up this round":"Give up this round")}
function disarm(){clearTimeout(armTimer);if(gu.classList.contains("armed"))setArmed(false)}
setArmed(false); // sets the accessible name (otherwise it would read both labels)
gu.onclick=()=>{if(S.i>=PER||busy)return;
  if(!gu.classList.contains("armed")){setArmed(true);armTimer=setTimeout(disarm,4000);return}
  disarm();forfeit("Gave up")};
gu.onblur=()=>disarm();
function setMap(t,zoom,minZ){
  if(FMT=="city"){$("map").innerHTML=`<span>${t[1]}<br>${t[2]}</span>`;return}const lat=t[3],lon=t[4],B=.03;
  // Free pan/zoom, but limited: can't pan far from the airport, can't zoom out past the starting view until the zoom-out hint (1st miss) unlocks it.
  map.setOptions({minZoom:minZ,maxZoom:Math.min(20,t[5]+3),restriction:{latLngBounds:{north:lat+B,south:lat-B,east:lon+B,west:lon-B}}});
  map.setCenter({lat,lng:lon});map.setZoom(zoom)}
function show(){
  V=S.i;navs();disarm();$("cluebox").hidden=false;
  if(S.i>=PER)return end();
  $("g").disabled=$("go").disabled=false;$("skip").disabled=$("giveup").disabled=false;
  const t=today[S.i],[c,city,st,,,z]=t,f=S.fails;
  $("round").textContent=`${MODE} ${S.i+1}/${PER}`;
  side();setMap(t,f>=1?10:z,f>=1?10:z-1);
}
function view(v){ // review a finished round: its airport, answer and result; no guessing
  V=v;navs();$("cluebox").hidden=true;const t=today[v];$("g").disabled=$("go").disabled=$("skip").disabled=$("giveup").disabled=true;
  $("round").textContent=`${MODE} ${v+1}/${PER}`;
  $("guesses").innerHTML=`<b>Round ${v+1}</b><div>${S.scores[v]>0?"Solved":"Missed"}</div><div>${t[0]}</div><div>${t[1]}, ${t[2]}</div><div>Score ${S.scores[v]}/${TRIES}</div>`;
  setMap(t,t[5],t[5]-1)}
const HOT=500; // miles: within this = hot, otherwise cold
const miles=(a,b,c,d)=>{const r=Math.PI/180,h=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 3959*2*Math.asin(Math.sqrt(h))};
let busy;
$("f").onsubmit=async e=>{e.preventDefault();
  if(S.i>=PER||busy)return;
  let g=$("g").value.trim().toUpperCase(); $("g").value="";
  if(g.length==3)g="K"+g; if(!/^K[A-Z]{3}$/.test(g))return;
  busy=1;const i0=S.i,t=today[S.i],c=t[0];let lbl=g;
  if(g!=c){const a=await fetch("/api/lookup?code="+g).then(r=>r.json()).catch(()=>({}));
    if(a.lat!=null){const d=Math.round(miles(a.lat,a.lon,t[3],t[4]));lbl+=(d<=HOT?" hot":" cold")+((S.guesses||[]).length>=2?` ${d} mi`:"")}} // distance shown from the 3rd guess on
  if(g==c){S.scores.push(TRIES-S.fails);S.i++;S.fails=0;S.guesses=[];S.clues=[];$("msg").textContent="";snd("correct");confetti()}
  else if((S.guesses||=[]).push(lbl),++S.fails>=TRIES){S.scores.push(0);S.i++;S.fails=0;S.guesses=[];S.clues=[];$("msg").textContent=`Out of guesses: ${c} (last guess ${lbl})`;snd("lost")}
  else snd("wrong")
  busy=0;save();S.i>i0?reveal(c):show()};
// Results screen -> "Review rounds": back to the board in read-only mode (Back/Next through the 5 rounds; Next from the last returns here).
$("review").onclick=()=>{snd("open");$("stats").hidden=true;$("board").hidden=$("nav").hidden=false;$("msg").textContent="";view(0)};
// Letter grade for the results screen: points out of the maximum, as a percentage. The color slides red -> orange -> green as the score
// approaches the A line (so an A is fully green).
const GRADES=[[70,"A"],[55,"B"],[40,"C"],[25,"D"],[0,"F"]]; // with only 20 points to earn, 14 of them (70%) is an A
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>`rgb(${hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t)).join(",")})`;
const gradeColor=p=>{const [r,o,g]=["--bad","--orange","--ok"].map(css);return p<50?mix(r,o,p/50):mix(o,g,(p-50)/50)};
function showGrade(points){
  const pct=Math.round(100*points/(PER*TRIES)),letter=GRADES.find(([min])=>pct>=min)[1];
  $("grade").style.color=gradeColor(Math.min(100,pct/.7));$("grade").setAttribute("aria-label",`Grade ${letter}, ${pct} percent`);
  $("grade").children[0].textContent=letter;$("grade").children[1].textContent=pct+"%"}
function end(){
  const t=S.scores.reduce((a,b)=>a+b,0);
  $("f").hidden=$("board").hidden=$("nav").hidden=true;$("stats").hidden=$("again").hidden=false;$("board").hidden=true;
  const right=S.scores.filter(v=>v>0).length;
  showGrade(t);
  $("statline").innerHTML=`You: <b>${right}/${PER}</b> right &middot; <b>${t}/${PER*TRIES}</b> points`;
  $("again").textContent=PRACTICE?"Change state":"Play another difficulty";
  if(PRACTICE){$("replay").hidden=false;$("replay").onclick=()=>location.href=`/?go=${MODE}&fmt=${FMT}&st=${ST}`;return} // practice: replay or change state, no global score
  let id;try{id=localStorage.pid=localStorage.pid||crypto.randomUUID()}catch{id=crypto.randomUUID()}
  fetch("/api/score",{method:"POST",body:JSON.stringify({id,day:DAY,mode:MODE+(FMT=="city"?"-city":""),score:t,right})}).then(r=>r.json()).then(d=>chart(d,t,right)).catch(()=>{$("msg").textContent+="  (no global stats yet)"})}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function chart(d,me,right){
  const dist=d.dist,c=$("chart"),x=c.getContext("2d"),n=PER*TRIES+1,m=Math.max(...Object.values(dist),1),w=c.width/n,base=190;
  c.hidden=false;x.clearRect(0,0,c.width,c.height);
  for(let k=0;k<n;k++){const h=(dist[k]||0)/m*150;x.globalAlpha=k==me?1:.35;x.fillStyle=k==me?css("--brand"):css("--text");x.fillRect(k*w+2,base-h,w-4,h);x.globalAlpha=1}
  x.fillStyle=css("--muted");x.font="11px system-ui";x.textAlign="center";for(let k=0;k<n;k+=5)x.fillText(k,k*w+w/2,base+14);
  // dotted vertical lines: the average player's score and yours; labels sit on opposite sides so they don't collide
  const mark=(v,col,label,y,align)=>{const px=(v+.5)*w;x.strokeStyle=x.fillStyle=col;x.lineWidth=2;x.setLineDash([4,4]);
    x.beginPath();x.moveTo(px,34);x.lineTo(px,base);x.stroke();x.setLineDash([]);x.font="bold 12px system-ui";x.textAlign=align;x.fillText(label,px+(align=="left"?5:-5),y)};
  const lowAvg=d.avg<=me;
  mark(d.avg,css("--text"),`Average ${d.avg.toFixed(1)}`,12,lowAvg?"right":"left");
  mark(me,css("--brand"),`You ${me}`,26,lowAvg?"left":"right");
  $("statline").innerHTML=`You: <b>${right}/${PER}</b> right &middot; <b>${me}/${PER*TRIES}</b> points<br>Average player (${d.n} played): <b>${d.avgRight==null?"–":d.avgRight.toFixed(1)}/${PER}</b> right &middot; <b>${d.avg.toFixed(1)}</b> points`}
// Menu background: a few muted planes fly straight across the screen. Most are small and slow, behind the containers; a few are larger,
// faster and fainter, passing in front of them for depth. Two colors only (amber and grey). Runs only while the menu / custom screen is
// showing (start() stops it).
const sky=(()=>{
  const BACK=3,FRONT=2,MAX=20,M=90; // 5 planes to start; clicking the background adds more, up to MAX; off-screen margin (px)
  let cb,cf,xb,xf,raf,W,H,running=false,last,cols,planes=[];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function spawn(front,anywhere,at){ // a straight line across, left to right or right to left; `at` = start at a clicked point
    const ltr=Math.random()<.5,h=(ltr?0:Math.PI)+rnd(-.5,.5);
    return{front,user:!!at,h,rot:h-NOSE,col:Math.random()<.5?0:1,
      x:at?at.x:anywhere?rnd(0,W):(ltr?-M:W+M),y:at?at.y:rnd(0,H),
      speed:front?rnd(55,85):rnd(22,38),s:front?rnd(46,64):rnd(18,30),a:front?.14:.2}}
  function step(dt){
    for(let i=planes.length-1;i>=0;i--){const p=planes[i];
      p.x+=Math.cos(p.h)*p.speed*dt;p.y+=Math.sin(p.h)*p.speed*dt;
      if(p.x<-M-10||p.x>W+M+10||p.y<-M-10||p.y>H+M+10)p.user?planes.splice(i,1):planes[i]=spawn(p.front,false)} // flown off the screen: a plane you launched is gone for good; the starting ones are replaced by a new plane entering
  }
  function draw(){
    for(const [cx] of [[xb],[xf]]){cx.clearRect(0,0,W,H);cx.textAlign="center";cx.textBaseline="middle"}
    for(const p of planes){const cx=p.front?xf:xb;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      cx.globalAlpha=p.a;cx.fillStyle=cols[p.col];cx.font=p.s+"px "+PLANE_FONT;cx.fillText("\u2708\uFE0E",0,0);cx.restore()}
  }
  // a click on empty menu background (not a button, link, field, footer or the logo) launches another plane, up to MAX
  function onClick(e){if(planes.length>=MAX||e.target.closest("button,a,select,input,label,#opts,footer,h2"))return;planes.push(spawn(Math.random()<.3,false,{x:e.clientX,y:e.clientY}))}
  function tick(n){if(!running)return;const dt=Math.min(.05,(n-last)/1e3);last=n;step(dt);draw();raf=requestAnimationFrame(tick)}
  function size(){W=cb.width=cf.width=innerWidth;H=cb.height=cf.height=innerHeight}
  return{
    start(){
      if(running||matchMedia("(prefers-reduced-motion: reduce)").matches)return; // decorative motion, so respect the preference
      running=true;
      cb=document.createElement("canvas");cb.className="fx";cf=document.createElement("canvas");cf.className="fx front";document.body.append(cb,cf);
      xb=cb.getContext("2d");xf=cf.getContext("2d");size();addEventListener("resize",size);document.addEventListener("click",onClick);
      cols=[css("--accent"),css("--muted")]; // two muted colors: amber and grey
      planes=[...Array.from({length:BACK},()=>spawn(false,true)),...Array.from({length:FRONT},()=>spawn(true,true))];
      last=performance.now();raf=requestAnimationFrame(tick);
    },
    count:()=>planes.length,sim(seconds,dt=.05){for(let t=0;t<seconds;t+=dt)step(dt)}, // for testing
    stop(){running=false;cancelAnimationFrame(raf);removeEventListener("resize",size);document.removeEventListener("click",onClick);cb&&cb.remove();cf&&cf.remove()},
  };
})();
sky.start();
</script>
